[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-cairn"
version = "0.1.0"
description = "Teaching-sized Cairn agent harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mini-cairn = "mini_cairn.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["mini_cairn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
