[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico"
version = "0.1.0"
description = "Small local coding agent for DeepSeek, OpenAI-compatible, Anthropic-compatible, and Ollama models"
requires-python = ">=3.10"
dependencies = [
  # Windows has no system tz database, so zoneinfo.ZoneInfo cannot resolve the
  # evaluator's Asia/Shanghai default without the PyPI tzdata package.
  "tzdata; sys_platform == 'win32'",
]

[project.scripts]
pico = "pico.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pico*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
